version: "3.9"

services:
  deutsch-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "1436:1433"
    volumes:
      - deutsch-data:/var/opt/mssql
    networks:
      - deutsch-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD:-YourStrong!Passw0rd}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 10

  deutsch-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8006:80"
    depends_on:
      deutsch-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "mssql+aioodbc://sa:${SA_PASSWORD:-YourStrong!Passw0rd}@deutsch-db:1433/DeutschDB?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes&LongAsMax=Yes"
      DATABASE_MIGRATION_URL: "mssql+pyodbc://sa:${SA_PASSWORD:-YourStrong!Passw0rd}@deutsch-db:1433/DeutschDB?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes&LongAsMax=Yes"
      SERVICE_NAME: deutsch-service
      SERVICE_ID: c0000006-0000-0000-0000-000000000001
    networks:
      - deutsch-net

volumes:
  deutsch-data:

networks:
  deutsch-net:
